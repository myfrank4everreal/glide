name: glide
description: AI navigation assistant for blind and low-vision users.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Architecture
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  go_router: ^18.1.2

  # On-device AI
  google_mlkit_text_recognition: ^0.17.1
  tflite_flutter: ^0.12.1

  # Hardware
  camera: ^0.12.2
  geolocator: ^14.1.2
  permission_handler: ^13.0.2
  sensors_plus: ^7.1.1

  # Feedback
  flutter_tts: ^4.2.5
  vibration: ^3.2.1

  # Storage
  flutter_secure_storage: ^11.2.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.0

dev_dependencies:
  bloc_test: ^10.0.0
  camera_platform_interface: ^2.15.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  geolocator_platform_interface: ^4.4.1
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  permission_handler_platform_interface: ^4.4.1
  plugin_platform_interface: ^2.1.8
  vibration_platform_interface: ^0.1.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/models/
